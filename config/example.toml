# Every Payments setting, each at its default. Secrets never go here, they come only from the
# environment (see .env.example). Durations take ms, s, m or h.

[http]
public_listen = "127.0.0.1:8450"
internal_listen = "127.0.0.1:8447"
public_url = "https://pay.bugnet.sh"
trusted_proxies = ["127.0.0.1", "::1"]
max_body_bytes = 65536

[database]
url = "postgres:///bugnet_payments?host=/var/run/postgresql"
pool_max = 20

[solana]
network = "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
usdc_mint = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
recipient = ""                          # cold owner address; its USDC account must exist
transaction_versions = [0]
max_compute_units = 50000
max_priority_fee_micro_lamports = 10000
max_required_signatures = 2
blockhash_cache_ttl = "8s"
rpc_timeout = "10s"                     # each RPC call of the jobs, from 1s to 60s
fee_payer_boot_min_lamports = 100000000

[orders]
unpaid_ttl = "15m"
unredeemed_refund_after = "30m"
token_ttl = "10m"
router_grace = "2m"
max_amount_micros = 100000000
attempts_per_order_per_minute = 5
min_idempotency_key_length = 16

[limits]
public_per_ip_per_minute = 60
status_per_ip_per_minute = 240          # GET /o/{id}/status only; it makes no RPC call

[router]
url = "http://127.0.0.1:8080"
timeout = "3s"
check_payer = false                     # true once router Task 28 serves PaymentsService.CheckPayer
get_order = false                       # true once the router serves GetOrder
allowance_claim = false                 # true once router Task 28 accepts allowance_micros
token_payer_claims = false              # true once router Task 28 accepts payer, fee_payer and tx
event_public_key = ""                   # standard base64 of the router's 32-byte event key

[refunds]
enabled = true
daily_cap_micros = 20000000             # a refund larger than this goes to the manual queue
max_per_hour = 10
float_low_micros = 10000000
compute_unit_limit = 20000
compute_unit_price_micro_lamports = 10000
max_attempts = 3

[alarms]
fee_payer_min_lamports = 100000000
max_lamports_per_order = 20000

[jobs]
sweep_every = "30s"                     # every *_every is from 1ms to 24h
reconcile_every = "10s"
refunds_every = "15s"
alarms_every = "5m"
audit_at_utc = "03:30"

[x402]
enabled = false                           # off refuses new allowances and payments only (7.3)
allowance_wallet = ""                     # owner address; when set, the key loads and the jobs run
listen = "127.0.0.1:8449"                 # the mTLS signer listener
tls_cert_file = "/etc/bugnet/payments/x402-server.pem"
client_ca_file = "/etc/bugnet/internal-ca.pem"   # shared with egress (6.17)
client_name = "bugnet-egress.internal"
indexed_services_file = "/etc/bugnet/payments/x402-index.json"
session_fee_micros = 3000
min_allowance_micros = 100000             # founder decision F3, approved 2026-11-07
suggested_allowance_micros = 1000000
max_allowance_per_sandbox_micros = 5000000
max_price_per_call_micros = 500000
default_spend_per_minute_micros = 500000
min_spend_per_minute_micros = 10000
max_spend_per_minute_micros = 5000000     # founder decision F5
max_services = 5                          # founder decision F4
max_new_services_per_order = 5            # lowered only for a wallet display limit (7.2)
refund_min_micros = 10000
pool_max_micros = 50000000
pool_unpaid_max_micros = 10000000         # founder decision F5
pool_high_alarm_percent = 80
unpaid_allowance_order_ttl = "5m"         # founder decision F5
outflow_daily_cap_micros = 100000000      # every seller payment (F1)
unlisted_daily_cap_micros = 20000000      # all unlisted payees together (F2)
payto_daily_cap_unlisted_micros = 20000000
payto_daily_cap_indexed_micros = 200000000
refund_daily_cap_micros = 50000000        # founder decision F5
max_open_payments_per_placement = 8       # Payments' own count (egress: max_open_signed_per_placement)
unreliable_after = 3
signed_payload_keep = "45s"               # under the blockhash's life of about 60 s (6.11)
sign_timeout = "2s"
lookup_timeout = "500ms"
reserved_release_after = "30s"
release_every = "5s"
seller_compute_unit_limit = 20000
seller_compute_unit_price_micro_lamports = 1
seller_compute_unit_price_max_micro_lamports = 1000
seller_memo_max_bytes = 32
fast_pass_every = "5s"
fast_pass_limit = 100
mirror_every = "5s"
mirror_idle_every = "60s"                 # founder decision F6
mirror_page_size = 1000
mirror_rescan_slots = 300
balance_mismatch_after = "2m"
tail_lag_alarm_after = "60s"
rpc_calls_per_hour_alarm = 5000
signer_check_stale_after = "2m"
unresolved_alarm_after = "10m"
close_check_every = "60s"
close_check_after = "10m"
close_unverifiable_after = "30m"
close_every = "5s"
close_slow_alarm_after = "10m"
resign_wait_alarm_after = "10m"           # founder decision F11
cold_transfer_check_every = "5m"
cold_transfer_max_age = "1h"
cold_transfer_threshold_micros = 20000000
cold_transfer_verify_age = "60s"
events_every = "2s"
events_batch = 50
events_max_backoff = "5m"
events_stuck_alarm_after = "10m"
cert_expiry_alarm_before = "720h"         # 30 days; the duration grammar has no d
